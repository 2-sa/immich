name: Fork Docker Build

on:
  workflow_dispatch:
    inputs:
      build_server:
        description: Build and push immich-server (API + Web + CLI + Plugins)
        type: boolean
        default: true
      build_ml:
        description: Build and push immich-machine-learning
        type: boolean
        default: true
      platforms:
        description: Target container platforms
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  detect-changes:
    name: Detect Build Scope
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      build_server: ${{ steps.scope.outputs.build_server }}
      build_ml: ${{ steps.scope.outputs.build_ml }}
      platforms: ${{ steps.scope.outputs.platforms }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize GHCR owner
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Determine images to build
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_server=${{ inputs.build_server }}" >> "$GITHUB_OUTPUT"
            echo "build_ml=${{ inputs.build_ml }}" >> "$GITHUB_OUTPUT"
            echo "platforms=${{ inputs.platforms }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "build_server=true" >> "$GITHUB_OUTPUT"
            echo "build_ml=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi

          if echo "$CHANGED" | grep -qE '^(\.github/workflows/fork-docker\.yml|server/|web/|i18n/|packages/|mise\.|pnpm-|package\.json|\.pnpmfile\.cjs|\.mise/)'; then
            echo "build_server=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_server=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -qE '^(\.github/workflows/fork-docker\.yml|machine-learning/)'; then
            echo "build_ml=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_ml=false" >> "$GITHUB_OUTPUT"
          fi

  build-server:
    name: Build and Push Server
    needs: detect-changes
    if: needs.detect-changes.outputs.build_server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: contains(needs.detect-changes.outputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ needs.detect-changes.outputs.owner }}/immich-server
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=release,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push immich-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ needs.detect-changes.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          build-args: |
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=ghcr.io/${{ needs.detect-changes.outputs.owner }}/immich-server
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}

  build-ml:
    name: Build and Push Machine Learning
    needs: detect-changes
    if: needs.detect-changes.outputs.build_ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: contains(needs.detect-changes.outputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ needs.detect-changes.outputs.owner }}/immich-machine-learning
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=release,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push immich-machine-learning
        uses: docker/build-push-action@v6
        with:
          context: machine-learning
          file: machine-learning/Dockerfile
          platforms: ${{ needs.detect-changes.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml
          build-args: |
            DEVICE=cpu

  create-release:
    name: Create GitHub Release
    needs: detect-changes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish Release with Compose and Env assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          OWNER: ${{ needs.detect-changes.outputs.owner }}
        run: |
          sed -i "s/^IMMICH_VERSION=.*/IMMICH_VERSION=${TAG}/" docker/example.env
          sed -i "s/^IMMICH_ML_VERSION=.*/IMMICH_ML_VERSION=${TAG}/" docker/example.env
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" docker/docker-compose.yml docker/example.env --clobber
          else
            gh release create "${TAG}" \
              docker/docker-compose.yml \
              docker/example.env \
              --title "${TAG}" \
              --notes "Custom Immich fork release **${TAG}**.

          ### Docker Images
          - \`ghcr.io/${OWNER}/immich-server:${TAG}\`
          - \`ghcr.io/${OWNER}/immich-machine-learning:${TAG}\`

          ### Quick Start
          Download \`docker-compose.yml\` and \`example.env\` from the assets below, rename \`example.env\` to \`.env\`, then run:
          \`\`\`bash
          docker compose pull && docker compose up -d
          \`\`\`"
          fi
